services:
  - type: web
    name: payment
    runtime: python
    plan: free
    # Single worker: state is in-memory and resolution runs as in-process async tasks.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: PAYMENT_PENDING_DELAY_SECONDS
        value: "15"
      - key: PAYMENT_FAILURE_RATE
        value: "0.05"
      - key: PAYMENT_MAX_ATTEMPTS
        value: "2"
