services:
  - type: web
    name: payment
    runtime: python
    plan: free
    # Single worker: state is in-memory and resolution runs as in-process async tasks.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PAYMENT_PENDING_DELAY_SECONDS
        value: "15"
      - key: PAYMENT_FAILURE_RATE
        value: "0.05"
      - key: PAYMENT_MAX_ATTEMPTS
        value: "2"
      - key: PAYMENT_LOG_LEVEL
        value: "INFO"
      - key: PAYMENT_API_KEY
        sync: false  # set manually in the Render dashboard when ready to enforce auth; unset = auth disabled
