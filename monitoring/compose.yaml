# Monitoring stack: Prometheus (http://localhost:9090) and Grafana (http://localhost:3000).
# Start: docker compose up -d --build   (from this folder)

services:
  prometheus:
    build: ./prometheus
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle  # POST /-/reload re-reads prometheus.yml without a restart
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach the payment service running on the host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/secrets:/etc/prometheus/secrets:ro  # scrape credentials, git-ignored
      - prometheus-data:/prometheus

  grafana:
    image: docker.io/grafana/grafana:11.4.0
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # local demo: dashboards readable without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
