# Services monitored by Prometheus (UI: http://localhost:9090).
# Every target must expose GET /metrics in the Prometheus text format.

global:
  scrape_interval: 15s
  scrape_timeout: 10s  # a sleeping Render instance takes 30-50 s to wake: DOWN until it answers

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Our service running on this machine (uvicorn on port 8000), seen from the container.
  - job_name: payment-local
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Our service deployed on Render.
  - job_name: payment
    scheme: https
    static_configs:
      - targets: ["payment-xp8n.onrender.com"]

  # Classmates' services (Render). Hosts only; metrics_path when it is not /metrics.
  - job_name: booking
    scheme: https
    metrics_path: /v2/booking/metrics
    static_configs:
      - targets: ["booking-api-vhy5.onrender.com"]

  - job_name: access
    scheme: https
    # Access protects /metrics with its X-API-Key. The key lives in secrets/ (git-ignored),
    # mounted read-only in the container; it is re-read at each scrape.
    http_headers:
      X-API-Key:
        files: ["/etc/prometheus/secrets/access_api_key"]
    static_configs:
      - targets: ["access-api-a1u7.onrender.com"]

  - job_name: parking
    scheme: https
    static_configs:
      - targets: ["parking-6r73.onrender.com"]
